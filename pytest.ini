[pytest]
testpaths = tests/suites
pythonpath = tests
addopts = -v --html=tests/reports/report.html --self-contained-html
markers =
    pub: Test kasus untuk halaman publik dan menu
    pos: Test kasus untuk sistem kasir POS
    adm: Test kasus untuk backoffice admin
    pay: Test kasus untuk pembayaran QRIS Midtrans
